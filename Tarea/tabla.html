<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Paleta Colores Tabla</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        section { background: #fff; padding: 15px; }
        table { width: 100%; border-collapse: collapse; }
        td { height: 60px; text-align: center; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <section>
        <h1>Paleta de colores en una tabla</h1>
        <table>
            <tr>
                <td style="background: #E57373;">#E57373</td>
                <td style="background: #F06292;">#F06292</td>
                <td style="background: #BA68C8;">#BA68C8</td>
                <td style="background: #9575CD;">#9575CD</td>
                <td style="background: #7986CB;">#7986CB</td>
            </tr>
            <tr>
                <td style="background: #64B5F6;">#64B5F6</td>
                <td style="background: #4FC3F7;">#4FC3F7</td>
                <td style="background: #4DD0E1;">#4DD0E1</td>
                <td style="background: #4DB6AC;">#4DB6AC</td>
                <td style="background: #81C784;">#81C784</td>
            </tr>
        </table>
    </section>

</body>
</html>
