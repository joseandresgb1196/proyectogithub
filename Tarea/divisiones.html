<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Paleta Colores Divisiones</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        section { background: #fff; padding: 15px; }
        .caja { height: 40px; text-align: center; line-height: 40px; color: white; font-weight: bold; margin-bottom: 2px; }
    </style>
</head>
<body>

    <section>
        <h1>Paleta de colores en una DIV</h1>
        <div class="caja" style="background: #FF5722;">Color 1 - #FF5722</div>
        <div class="caja" style="background: #FF9800;">Color 2 - #FF9800</div>
        <div class="caja" style="background: #FFC107;">Color 3 - #FFC107</div>
        <div class="caja" style="background: #FFEB3B;">Color 4 - #FFEB3B</div>
        <div class="caja" style="background: #CDDC39;">Color 5 - #CDDC39</div>
        <div class="caja" style="background: #8BC34A;">Color 6 - #8BC34A</div>
        <div class="caja" style="background: #4CAF50;">Color 7 - #4CAF50</div>
        <div class="caja" style="background: #009688;">Color 8 - #009688</div>
        <div class="caja" style="background: #00BCD4;">Color 9 - #00BCD4</div>
        <div class="caja" style="background: #03A9F4;">Color 10 - #03A9F4</div>
    </section>

</body>
</html>
