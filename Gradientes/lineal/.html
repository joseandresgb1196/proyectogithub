<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente lineal</title>
    <style>
    body {background-color: #ccffcc;}
    #grad1 {
        height: 100px;
        background:linear-gradient(yellow, blue);
    }
    #grad2 {
        height: 100px;
        background: linear-gradient(90deg, yellow, blue);
    }
</style>
</head>
<body>
    <h3>Linear Gradient</h3>
    <p>Comienza al principio del elemento y cambia de 
        amarillo a azul</p>
    <div id="grad1"></div>
    <p>En este caso su asigna un ángulo de 90 grados
        para hacer la transición
    </p>    
    <div id="grad2"></div>
</body>
</html>
